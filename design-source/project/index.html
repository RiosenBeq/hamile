<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Marigold — Pregnancy Safety Companion</title>

  <!-- Fonts: warm serif (display) + humanist sans (UI) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=Sohne:wght@400;500;600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Tailwind (Play CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            display: ['"Source Serif 4"', 'Tiempos Headline', 'Georgia', 'serif'],
            sans: ['Manrope', '-apple-system', '"SF Pro Text"', 'system-ui', 'sans-serif'],
          },
          colors: {
            base: '#FBF7F2',
            surface: '#FFFFFF',
            sand: '#F4EDE4',
            terracotta: '#C77B5C',
            rose: '#E8C4B8',
            sage: '#7B9B7E',
            amber2: '#D9A05B',
            coral: '#C66B5C',
            ink: '#2A2522',
            mute: '#7A6F66',
            line: '#EDE4D8',
            lavender: '#B5A8C9',
          },
          boxShadow: {
            card: '0 4px 24px -8px rgba(42,37,34,0.08)',
            cardHi: '0 12px 40px -16px rgba(42,37,34,0.18)',
          },
          borderRadius: { card: '20px', btn: '14px' },
        }
      }
    }
  </script>

  <style>
    html, body { background: #1A1614; color: #2A2522; font-family: 'Manrope', system-ui, sans-serif; }
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .font-display { font-family: 'Source Serif 4', Georgia, serif; font-feature-settings: 'liga','kern'; letter-spacing: -0.02em; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    @media (prefers-reduced-motion: reduce) {
      * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
    }
    /* Soft watercolor blob using radial gradients */
    .blob-cream { background:
      radial-gradient(60% 50% at 30% 20%, rgba(232,196,184,0.65), transparent 60%),
      radial-gradient(50% 40% at 80% 80%, rgba(181,168,201,0.5), transparent 60%),
      radial-gradient(70% 60% at 50% 60%, rgba(217,160,91,0.18), transparent 70%),
      #FBF7F2;
    }
    .blob-lavender { background:
      radial-gradient(60% 50% at 70% 30%, rgba(181,168,201,0.7), transparent 60%),
      radial-gradient(50% 50% at 25% 75%, rgba(232,196,184,0.55), transparent 60%),
      #FBF7F2;
    }
    .grain::after {
      content: ''; position: absolute; inset: 0; pointer-events: none; opacity: 0.06; mix-blend-mode: multiply;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    }
    .scanline {
      position: absolute; left: 6%; right: 6%; height: 1.5px;
      background: linear-gradient(90deg, transparent, rgba(217,160,91,0.0) 5%, rgba(217,160,91,0.85) 50%, rgba(217,160,91,0.0) 95%, transparent);
      box-shadow: 0 0 18px rgba(217,160,91,0.55);
      border-radius: 2px;
    }
    .shimmer {
      background: linear-gradient(90deg, #F4EDE4 0%, #FBF7F2 40%, #F8E9D9 50%, #FBF7F2 60%, #F4EDE4 100%);
      background-size: 200% 100%;
      animation: shim 1.4s linear infinite;
    }
    @keyframes shim { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    .drift { animation: drift 3s ease-in-out infinite; }
    @keyframes drift { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-8px) } }
    .pulse-soft { animation: pulseSoft 2.4s ease-in-out infinite; }
    @keyframes pulseSoft { 0%,100% { opacity: 1 } 50% { opacity: 0.55 } }
  </style>

  <!-- React + Framer Motion + Babel -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/framer-motion@11.3.19/dist/framer-motion.js" crossorigin="anonymous"></script>
  <script>
    // Normalize framer-motion UMD global (exposes as `Motion` in v11 UMD)
    window.framerMotion = window.framerMotion || window.Motion || window.FramerMotion || {};
  </script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="ios-frame.jsx"></script>
  <script type="text/babel" src="marigold-tokens.jsx"></script>
  <script type="text/babel" src="marigold-screens-onboarding.jsx"></script>
  <script type="text/babel" src="marigold-screens-core.jsx"></script>
  <script type="text/babel" src="marigold-screens-tools.jsx"></script>
  <script type="text/babel" src="marigold-screens-history.jsx"></script>
  <script type="text/babel" src="marigold-app.jsx"></script>
</body>
</html>
